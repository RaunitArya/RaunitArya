# GitHub Action for generating an animated contribution graph snake

name: Generate Snake
permissions: 
  contents: write

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
      # Check out repository
      - uses: actions/checkout@v4

      # Generate the animated SVG snake
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RaunitArya
          outputs: dist/github-snake.svg

      # Show build status (for debugging)
      - run: git status

      # Publish the output to the "output" branch
      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
